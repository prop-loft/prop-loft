<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prop Loft — Catalog</title>
</head>
<body>
  <h1>Catalog</h1>
  {% if items %}
    <table>
      <thead>
        <tr><th>Item</th><th>Category</th><th>Size</th><th>Condition</th><th>Bin</th></tr>
      </thead>
      <tbody>
        {% for item in items %}
          <tr>
            <td>{{ item.name }}</td>
            <td>{{ item.get_category_display }}</td>
            <td>{{ item.size_label|default:"—" }}</td>
            <td>{{ item.get_condition_display }}</td>
            <td>{{ item.bin }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>Nothing in the catalog yet. Add items in the admin.</p>
  {% endif %}
</body>
</html>
